name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ['*-RELEASE']
  pull_request:
    branches: [main]
  schedule:
    # Weekly rebuild of :main for base image patches (Monday 18:00 UTC)
    - cron: '0 18 * * 1'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Extra image tag (e.g. edge)'
        required: true

permissions:
  contents: read
  packages: write
  id-token: write
  attestations: write

env:
  TEST_IMAGE: snap-provider-simulator:test

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Push allowed?
        id: push
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: temurin
          cache: maven

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Build amd64 image for testing
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ env.TEST_IMAGE }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image tests
        run: ./mvnw -B -P image-test test -Dimage.name=${{ env.TEST_IMAGE }}

      - name: Log in to GHCR
        if: steps.push.outputs.enabled == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/snap-provider-simulator
          # main → :main, :main-<sha>; tag 2026.10-RELEASE → :2026.10-RELEASE, :2026.10, :latest
          tags: |
            type=ref,event=branch
            type=ref,event=pr,prefix=pr-
            type=ref,event=tag
            type=match,pattern=(.*)-RELEASE,group=1
            type=sha,prefix=main-,enable={{is_default_branch}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') && endsWith(github.ref, '-RELEASE') }}
            type=raw,value=main,enable=${{ github.event_name == 'schedule' }}
            type=raw,value=${{ github.event.inputs.tag }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Build and push amd64 + arm64
        id: build
        if: steps.push.outputs.enabled == 'true'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Attest GHCR image
        if: steps.push.outputs.enabled == 'true'
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository_owner }}/snap-provider-simulator
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
