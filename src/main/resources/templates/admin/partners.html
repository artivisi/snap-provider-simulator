<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: layout(~{::title}, ~{::main})}">
<head><title>Partners · SNAP Provider Simulator</title></head>
<body>
<main>
    <h1>Partners</h1>
    <p class="alert" th:if="${message}" th:text="${message}" id="flash-message"></p>
    <p th:if="${rows.isEmpty()}" id="no-partners">No partners registered.</p>
    <section th:each="row : ${rows}" class="partner" th:attr="data-testid=|partner-${row.account.email}|">
        <h2>
            <span th:text="${row.account.email}"></span>
            <span class="badge status" th:classappend="${row.enabled} ? 'done' : 'error'"
                  th:text="${row.enabled} ? 'Enabled' : 'Disabled'"></span>
        </h2>
        <p th:if="${row.account.connections.isEmpty()}" class="no-connections">No bank connections.</p>
        <table class="table" th:unless="${row.account.connections.isEmpty()}">
            <thead><tr><th>Bank</th><th>partnerServiceId</th><th>Client id</th><th>Checklist</th><th></th></tr></thead>
            <tbody>
            <tr th:each="c : ${row.account.connections}" class="connection" th:attr="data-bank=${c.bank}">
                <td th:text="${c.bank}"></td>
                <td><code th:text="|&quot;${c.partnerServiceId}&quot;|"></code></td>
                <td><code th:text="${c.clientId}"></code></td>
                <td class="checklist-progress" th:text="|${c.stepsDone()} / ${c.checklist.size()}|"></td>
                <td>
                    <form th:action="@{/admin/connections/{id}/reset(id=${c.id})}" method="post" class="inline"
                          onsubmit="return confirm('Delete all VAs, payments, tokens and logs of this connection?')">
                        <button type="submit" class="secondary action-reset">Reset data</button>
                    </form>
                </td>
            </tr>
            </tbody>
        </table>
        <div class="actions">
            <form th:if="${row.enabled}" th:action="@{/admin/partners/{id}/disable(id=${row.id})}" method="post" class="inline">
                <button type="submit" class="secondary action-disable">Disable</button>
            </form>
            <form th:unless="${row.enabled}" th:action="@{/admin/partners/{id}/enable(id=${row.id})}" method="post" class="inline">
                <button type="submit" class="secondary action-enable">Enable</button>
            </form>
            <form th:action="@{/admin/partners/{id}/delete(id=${row.id})}" method="post" class="inline"
                  onsubmit="return confirm('Delete this partner and all its connections and data?')">
                <button type="submit" class="danger action-delete">Delete</button>
            </form>
        </div>
    </section>
</main>
</body>
</html>
