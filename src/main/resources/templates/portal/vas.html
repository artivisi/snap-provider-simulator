<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: layout(~{::title}, ~{::main})}">
<head><title>Virtual accounts · SNAP Provider Simulator</title></head>
<body>
<main>
    <h1>Bank-hosted virtual accounts</h1>
    <p>VAs your app created with <code>create-va</code>. "Pay" simulates a customer paying the VA at a bank channel:
        the bank credits its ledger and, if your endpoint is registered, sends the payment call with the VA's
        <code>trxId</code>.</p>
    <th:block th:replace="~{fragments/flash :: flash}"></th:block>
    <p th:if="${vas.isEmpty()}" id="no-vas">No VAs yet.</p>
    <table class="table" id="vas" th:unless="${vas.isEmpty()}">
        <thead><tr><th>VA number</th><th>Name</th><th>trxId</th><th>Amount</th><th>Expires</th><th>Status</th><th></th></tr></thead>
        <tbody>
        <tr th:each="va : ${vas}" th:attr="data-testid=|va-${va.trxId}|">
            <td><code th:text="|&quot;${va.virtualAccountNo}&quot;|"></code></td>
            <td th:text="${va.virtualAccountName}"></td>
            <td><code th:text="${va.trxId}"></code></td>
            <td th:text="|${va.currency} ${va.totalAmount}|"></td>
            <td th:text="${va.expiredDate != null} ? ${#temporals.format(va.expiredDate, 'yyyy-MM-dd HH:mm')} : '-'"></td>
            <td><span class="badge va-status" th:classappend="${va.status.name() == 'PAID'} ? 'done'" th:text="${va.status}"></span></td>
            <td>
                <form th:if="${va.status.name() == 'ACTIVE'}" th:action="@{/portal/vas/pay}" method="post" class="inline">
                    <input type="hidden" name="virtualAccountNo" th:value="${va.virtualAccountNo}">
                    <select name="channelId" class="channel" required>
                        <option th:each="c : ${channels}" th:value="${c.id()}" th:text="|${c.id()} ${c.label()}|"></option>
                    </select>
                    <button type="submit" class="secondary pay">Pay</button>
                </form>
            </td>
        </tr>
        </tbody>
    </table>
</main>
</body>
</html>
