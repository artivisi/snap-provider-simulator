<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" th:replace="~{layouts/main :: layout(~{::title}, ~{::main})}">
<head><title>Sign up · SNAP Provider Simulator</title></head>
<body>
<main class="narrow">
    <h1>Register a partner app</h1>
    <p>One account is one partner app. After logging in, add a connection for each bank the app works with;
        each connection gets its own VA prefix (<code>partnerServiceId</code>), client id and client secret.</p>
    <form th:action="@{/portal/signup}" th:object="${form}" method="post" class="stack" id="signup-form">
        <label>Email
            <input type="email" th:field="*{email}" required>
            <span class="field-error" th:if="${#fields.hasErrors('email')}" th:errors="*{email}" id="email-error"></span>
        </label>
        <label>Password (8–72 characters)
            <input type="password" th:field="*{password}" required minlength="8" maxlength="72">
            <span class="field-error" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></span>
        </label>
        <button type="submit" id="signup-submit">Sign up</button>
    </form>
    <p>Already registered? <a th:href="@{/portal/login}">Log in</a>.</p>
</main>
</body>
</html>
